[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sync-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.16.0",
    "black==26.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sync_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
